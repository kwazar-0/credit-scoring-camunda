# VitePress: установка зависимостей и сборка (без публикации). Отдельно от Python CI.
name: Docs (VitePress build)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-vitepress.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-vitepress.yml"

permissions:
  contents: read

concurrency:
  group: docs-vitepress-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (site root base, как локально)
        run: npm run docs:build
