# VitePress only: install dependencies and build the static site (separate from backend/worker CI).
name: VitePress (install + build)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-vitepress.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-vitepress.yml"

permissions:
  contents: read

jobs:
  vitepress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run docs:build
