# VitePress: install + build (no deploy). Uses Node 24 + actions on Node 24 runtime.
# If you still see Node 20 warnings from a third-party action, set FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true (repo or org variable).
name: Docs (VitePress build)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-vitepress.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-vitepress.yml"

permissions:
  contents: read

concurrency:
  group: docs-vitepress-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run docs:build
