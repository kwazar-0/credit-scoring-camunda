# Deploy VitePress to GitHub Pages. Requires: Settings → Pages → Source: **GitHub Actions**
# (not "Deploy from a branch" alone). If deploy fails with 404, enable Pages or approve the `github-pages` environment.
#
# Project URL: https://<owner>.github.io/<repo>/  →  VITEPRESS_BASE must match /repo/
name: Docs (VitePress → GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vitepress-gh-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (base for https://<owner>.github.io/<repo>/)
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
